<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sonu Chaudhary. Lead Penetration Tester. Red teaming and AI security.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#101c33"/>
      <stop offset="1" stop-color="#0e2a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
      .ring{transform-origin:975px 150px;animation:spin 40s linear infinite}
      .ping{transform-origin:975px 150px;animation:ping 3.6s ease-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes ping{0%{transform:scale(.35);opacity:.7}100%{transform:scale(1.15);opacity:0}}
      @media (prefers-reduced-motion:reduce){.ring,.ping{animation:none}.ping{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow)"/>

  <!-- left text -->
  <rect x="72" y="62" width="56" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="130" class="t" font-size="58" font-weight="700" fill="#f8fafc" letter-spacing="-1">Sonu Chaudhary</text>
  <text x="72" y="172" class="t" font-size="24" fill="#cbd5e1">Lead Penetration Tester</text>
  <text x="72" y="206" class="t" font-size="18" fill="#94a3b8">Red teaming · Application security · AI and MCP security</text>

  <g class="t" font-size="14" font-weight="600">
    <rect x="72" y="232" width="150" height="30" rx="15" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="147" y="252" text-anchor="middle" fill="#7dd3fc">Break it to fix it</text>
    <rect x="234" y="232" width="150" height="30" rx="15" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="309" y="252" text-anchor="middle" fill="#6ee7b7">Open source</text>
  </g>

  <!-- right: crosshair / radar motif -->
  <g fill="none" stroke="url(#accent)" stroke-width="1.5">
    <circle cx="975" cy="150" r="104" stroke-opacity="0.25"/>
    <circle cx="975" cy="150" r="72" stroke-opacity="0.4"/>
    <circle cx="975" cy="150" r="40" stroke-opacity="0.6"/>
    <circle class="ping" cx="975" cy="150" r="104" stroke-opacity="0.8"/>
    <g class="ring" stroke-opacity="0.5" stroke-dasharray="3 9">
      <circle cx="975" cy="150" r="124"/>
    </g>
    <path d="M975 22V76M975 224V278M847 150H901M1049 150H1103" stroke-opacity="0.55" stroke-linecap="round"/>
  </g>
  <!-- shield -->
  <path d="M975 118 L1003 128 V152 C1003 170 991 181 975 188 C959 181 947 170 947 152 V128 Z" fill="#0b1220" stroke="url(#accent)" stroke-width="2.5"/>
  <path d="M963 152 l9 9 l17 -19" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
