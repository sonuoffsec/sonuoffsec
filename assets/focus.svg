<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Focus areas: offensive security, AI and MCP security, security tooling, vulnerable labs.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
      .card{fill:#0f172a;stroke:#1e293b;stroke-width:1.5}
      .h{font-size:19px;font-weight:700;fill:#f1f5f9}
      .s{font-size:14px;fill:#94a3b8}
      .ic{fill:none;stroke:url(#accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <g class="t">
    <!-- 1 offensive -->
    <rect class="card" x="0" y="0" width="285" height="190" rx="12"/>
    <g class="ic" transform="translate(28 28)"><circle cx="16" cy="16" r="12"/><path d="M16 0v8M16 24v8M0 16h8M24 16h8"/></g>
    <text class="h" x="28" y="104">Offensive security</text>
    <text class="s" x="28" y="132">Web and API pentesting,</text>
    <text class="s" x="28" y="152">red teaming, bug bounty</text>

    <!-- 2 AI -->
    <rect class="card" x="305" y="0" width="285" height="190" rx="12"/>
    <g class="ic" transform="translate(333 28)"><rect x="4" y="4" width="24" height="24" rx="5"/><path d="M12 12h8v8h-8zM10 0v4M22 0v4M10 28v4M22 28v4M0 10h4M0 22h4M28 10h4M28 22h4"/></g>
    <text class="h" x="333" y="104">AI and MCP security</text>
    <text class="s" x="333" y="132">Prompt injection, RAG and</text>
    <text class="s" x="333" y="152">agent abuse, MCP servers</text>

    <!-- 3 tooling -->
    <rect class="card" x="610" y="0" width="285" height="190" rx="12"/>
    <g class="ic" transform="translate(638 28)"><path d="M10 8l-8 8 8 8M22 8l8 8-8 8M19 4l-6 24"/></g>
    <text class="h" x="638" y="104">Security tooling</text>
    <text class="s" x="638" y="132">Scanners and Burp extensions</text>
    <text class="s" x="638" y="152">built from real engagements</text>

    <!-- 4 labs -->
    <rect class="card" x="915" y="0" width="285" height="190" rx="12"/>
    <g class="ic" transform="translate(943 28)"><path d="M12 2v10L3 28a2 2 0 0 0 2 3h22a2 2 0 0 0 2-3L20 12V2M9 2h14M8 22h16"/></g>
    <text class="h" x="943" y="104">Vulnerable labs</text>
    <text class="s" x="943" y="132">Deliberately insecure targets</text>
    <text class="s" x="943" y="152">and cheat sheets to learn on</text>
  </g>
</svg>
