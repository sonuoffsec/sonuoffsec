<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="sonu@linux:~$ whoami. Sonu Chaudhary. Security research, penetration testing, AI and LLM security.">
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .reveal{animation:rev 3.2s steps(52,end) .4s both}
    @keyframes rev{from{width:0}to{width:760px}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.reveal{animation:none;width:760px}.cur{animation:none}}
  </style>
  <defs><clipPath id="c"><rect class="reveal" x="40" y="104" width="760" height="34"/></clipPath></defs>
  <rect x="1" y="1" width="898" height="168" rx="12" fill="#0b0f14" stroke="#1f2a3a"/>
  <rect x="1" y="1" width="898" height="30" rx="12" fill="#111823"/>
  <rect x="1" y="20" width="898" height="11" fill="#111823"/>
  <circle cx="24" cy="16" r="5" fill="#ff5f57"/><circle cx="44" cy="16" r="5" fill="#febc2e"/><circle cx="64" cy="16" r="5" fill="#28c840"/>
  <text class="m" x="450" y="20" text-anchor="middle" font-size="12" fill="#8394aa">sonu@linux: ~</text>
  <text class="m" x="40" y="62" font-size="15" fill="#8394aa"><tspan fill="#4f8ef7">sonu@linux</tspan>:~$ whoami</text>
  <text class="m" x="40" y="96" font-size="30" font-weight="700" fill="#d6deeb">Sonu Chaudhary</text>
  <g clip-path="url(#c)">
    <text class="m" x="40" y="128" font-size="17" fill="#5fd38d">Penetration tester · Red teamer · AI &amp; LLM security</text>
  </g>
  <rect class="cur" x="523" y="114" width="9" height="18" fill="#5fd38d"/>
</svg>
